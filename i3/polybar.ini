; Add to your polybar config, then put "timur" in modules-right (or left/center).
[module/timur]
type = custom/script
exec = ~/.local/bin/timur-bar bar --polybar
interval = 30
click-left = setsid -f ~/.local/bin/timur-menu
click-middle = systemctl --user start timur-bar-refresh.service
click-right = setsid -f xdg-open https://timur.dev.togglecorp.com/
scroll-up = setsid -f ~/.local/bin/timur-menu log
