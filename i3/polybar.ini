; Add to your polybar config, then put "timur" in modules-right (or left/center).
; Shows today's logged time, plus "· N todo" while TODO/DOING entries are open.
[module/timur]
type = custom/script
exec = ~/.local/bin/timur-bar bar --polybar
; Reads the local cache only (no network), so a short interval is cheap and the bar updates soon after a save.
interval = 5
click-left = setsid -f ~/.local/bin/timur-panel
click-middle = systemctl --user start timur-bar-refresh.service
click-right = setsid -f ~/.local/bin/timur-panel journal
scroll-up = setsid -f ~/.local/bin/timur-menu
scroll-down = setsid -f xdg-open https://timur.dev.togglecorp.com/
